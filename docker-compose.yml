services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kilter
      POSTGRES_USER: kilter
      POSTGRES_PASSWORD: kilter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kilter -d kilter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
