[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kilter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # MCP SDK — pinned. v2 renames FastMCP; unpinned surprises mid-sprint.
    "mcp>=1.27,<2",
    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    # Database
    "asyncpg>=0.29,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    # HTTP
    "httpx>=0.27,<1",
    # Stats
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    # Embeddings
    "openai>=1.30,<2",
    # Scheduler
    "apscheduler>=3.10,<4",
    # Logging
    "structlog>=24,<26",
    # Config
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "api*"]
